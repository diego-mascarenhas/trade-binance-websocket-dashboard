<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binance Live Dashboards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="shell">
        <header class="header">
            <div>
                <h1>Binance Live Dashboards</h1>
                <p class="subtitle">Live signal, trend, and position per pair.</p>
            </div>
            <div class="meta" id="meta"></div>
        </header>
        <main id="grid" class="grid"></main>
        <p class="footer" id="footer"></p>
    </div>
    <script>
        const grid = document.getElementById("grid");
        const meta = document.getElementById("meta");
        const footer = document.getElementById("footer");
        const host = window.location.hostname || "127.0.0.1";
        const REFRESH_MS = 3000;

        function signalBadge(signal) {
            if (signal === "LONG") return "badge badge-bull";
            if (signal === "SHORT") return "badge badge-bear";
            return "badge badge-neutral";
        }

        function actionBadge(action) {
            return action === "TRADE" ? "badge badge-trade" : "badge badge-watch";
        }

        function trendBadge(trend) {
            if (trend === "BULLISH") return "badge badge-bull";
            if (trend === "BEARISH") return "badge badge-bear";
            return "badge badge-neutral";
        }

        function changeClass(value) {
            if (value == null) return "stat-value";
            if (value > 0) return "stat-value change-up";
            if (value < 0) return "stat-value change-down";
            return "stat-value";
        }

        function statRow(label, value, valueClass = "stat-value") {
            return `
                <div class="stat-row">
                    <span class="stat-label">${label}</span>
                    <span class="${valueClass}">${value}</span>
                </div>
            `;
        }

        function obClass(obNear) {
            if (obNear === "support" || obNear === "support-side") {
                return "stat-value near-support";
            }
            if (obNear === "resistance" || obNear === "resistance-side") {
                return "stat-value near-resistance";
            }
            return "stat-value";
        }

        function cardShell(pair) {
            const url = `http://${host}:${pair.port}/`;
            const article = document.createElement("article");
            article.className = "card";
            article.dataset.port = String(pair.port);
            article.innerHTML = `
                <div class="card-head">
                    <span class="symbol">${pair.symbol}</span>
                    <span class="port">:${pair.port}</span>
                </div>
                <div class="badge-row">
                    <span class="badge badge-neutral card-signal">—</span>
                    <span class="badge badge-neutral card-action">—</span>
                </div>
                <div class="card-stats">
                    ${statRow("Price", "—")}
                    ${statRow("24h", "—")}
                    ${statRow("Confidence", "—")}
                    ${statRow("Trend", "—")}
                    ${statRow("OB zone", "—")}
                    ${statRow("Position", "—")}
                </div>
                <p class="card-status">Connecting…</p>
                <a class="card-link" href="${url}" target="_blank" rel="noopener noreferrer">Open dashboard</a>
            `;
            return article;
        }

        function renderSummary(article, data) {
            const signalEl = article.querySelector(".card-signal");
            const actionEl = article.querySelector(".card-action");
            signalEl.textContent = data.signal || "NEUTRAL";
            signalEl.className = signalBadge(data.signal);
            actionEl.textContent = data.action || "WATCH";
            actionEl.className = actionBadge(data.action);

            const stats = article.querySelector(".card-stats");
            const trendValue = data.trend || "NEUTRAL";
            stats.innerHTML = [
                statRow("Price", data.price_display || "—", "stat-value strong"),
                statRow("24h", data.change_display || "—", changeClass(data.change_24h)),
                statRow("Confidence", `${data.confidence ?? 0}%`, "stat-value strong"),
                statRow("Trend", trendValue, trendBadge(trendValue)),
                statRow("OB zone", data.ob_proximity || "—", obClass(data.ob_near)),
                statRow(
                    "Position",
                    data.position || "None",
                    data.position_open ? "stat-value strong position-open" : "stat-value"
                ),
            ].join("");

            const statusEl = article.querySelector(".card-status");
            const exec = data.execution_enabled ? data.execution_mode.toUpperCase() : "OFF";
            statusEl.textContent = `${data.ws_status || "—"} · exec ${exec}`;
            statusEl.className = "card-status";
        }

        function renderOffline(article) {
            const signalEl = article.querySelector(".card-signal");
            const actionEl = article.querySelector(".card-action");
            signalEl.textContent = "OFFLINE";
            signalEl.className = "badge badge-neutral";
            actionEl.textContent = "—";
            actionEl.className = "badge badge-neutral";
            const statusEl = article.querySelector(".card-status");
            statusEl.textContent = "Dashboard not reachable";
            statusEl.className = "card-status card-status-offline";
        }

        async function fetchSummary(pair) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 2500);
            try {
                const response = await fetch(`http://${host}:${pair.port}/api/hub-summary`, {
                    mode: "cors",
                    signal: controller.signal,
                });
                if (!response.ok) {
                    throw new Error(String(response.status));
                }
                return await response.json();
            } finally {
                clearTimeout(timeout);
            }
        }

        async function refreshCards(pairs, cards) {
            await Promise.all(
                pairs.map(async (pair, index) => {
                    try {
                        const data = await fetchSummary(pair);
                        renderSummary(cards[index], data);
                    } catch {
                        renderOffline(cards[index]);
                    }
                })
            );
        }

        fetch("pairs.json")
            .then((response) => {
                if (!response.ok) {
                    throw new Error("pairs.json not found");
                }
                return response.json();
            })
            .then((pairs) => {
                if (!Array.isArray(pairs) || pairs.length === 0) {
                    throw new Error("No pairs configured");
                }
                meta.textContent = `${pairs.length} pairs · hub :${window.location.port || "8050"}`;
                const cards = pairs.map((pair) => {
                    const article = cardShell(pair);
                    grid.appendChild(article);
                    return article;
                });
                footer.textContent = "Updates every 3s · Start with ./run-all.sh";
                refreshCards(pairs, cards);
                setInterval(() => refreshCards(pairs, cards), REFRESH_MS);
            })
            .catch((error) => {
                meta.textContent = "Hub idle";
                grid.innerHTML = `<div class="empty">Run <code>./run-all.sh</code> to generate pairs.json and start the dashboards.<br><small>${error.message}</small></div>`;
            });
    </script>
</body>
</html>
